[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attiny-uploader"
version = "0.1.0"
description = "Toolchain-agnostic CLI for ESP32-based ATtiny UPDI programming"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
attiny-uploader = "attiny_uploader.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["attiny_uploader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

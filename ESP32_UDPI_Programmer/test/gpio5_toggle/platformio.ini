; Plain GPIO square wave (default GPIO 5) at 1 Hz (500 ms per half-cycle).
; See ../README.md

[platformio]
extra_configs = ../platformio_common.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
build_flags =
    ${common.usb_serial_baud}
    -DGPIO_PIN=5
    -DHALF_PERIOD_MS=500

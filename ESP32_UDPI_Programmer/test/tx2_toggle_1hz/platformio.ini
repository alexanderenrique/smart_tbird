; Scope test: square wave on GPIO 17 (TX2) at 1 Hz.
; See ../README.md

[platformio]
extra_configs = ../platformio_common.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
build_flags =
    ${common.usb_serial_baud}
    -DTX_PIN=17
    -DRX_PIN=16
    -DHALF_PERIOD_MS=10

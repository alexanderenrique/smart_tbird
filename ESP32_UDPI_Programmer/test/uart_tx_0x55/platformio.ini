; Scope test: stream 0x55 on Serial2 TX (GPIO 17) at 115200 baud.
; See ../README.md

[platformio]
extra_configs = ../platformio_common.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
build_flags =
    ${common.usb_serial_baud}
    -DTX_PIN=17
    -DRX_PIN=16
    -DBAUD=115200
    -DSTATUS_INTERVAL_MS=1000
    -DMATCH_UPDI_PHY=1

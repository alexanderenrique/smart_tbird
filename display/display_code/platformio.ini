; Smart Thunderbird in-dash display — ESP32-S3
; Build:  pio run -e display
; Flash:  pio run -e display -t upload
; Test UI: pio run -e lvgl_test -t upload
;
; If upload reports "N8 (No PSRAM)" use the [env:display_n8] section below instead.

[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE
    -DUSER_SETUP_LOADED=1
    -include include/tft_setup.h
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
monitor_filters = esp32_exception_decoder
lib_deps =
    lvgl@^8.3.0
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit BusIO@^1.17.2
    miq19/eModbus@^1.7.4

[env:display]
build_src_filter = +<main.cpp> +<ui.cpp>

; Use this env if your module is ESP32-S3-WROOM-1-N8 (8 MB flash, no PSRAM)
[env:display_n8]
build_src_filter = +<main.cpp> +<ui.cpp>
board_build.arduino.memory_type = qio_qspi
board_build.psram_type =
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE
    -DUSER_SETUP_LOADED=1
    -include include/tft_setup.h
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
monitor_filters = esp32_exception_decoder

[env:lvgl_test]
build_src_filter = +<lvgl_test_main.cpp>
lib_deps =
    lvgl@^8.3.0
    bodmer/TFT_eSPI@^2.5.43

; Waveshare ESP32-S3-Touch-LCD-5B (1024x600 RGB + GT911 touch)
; Based on ESP32_Display_Panel PlatformIO LVGL v8 port example:
; https://github.com/esp-arduino-libs/ESP32_Display_Panel/tree/master/examples/platformio/lvgl_v8_port

[platformio]
default_envs = BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_5_B

[env]
framework = arduino
; Official espressif32 platform lags Arduino 3.x RGB LCD fixes; use pioarduino build
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
  platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
  platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
  ; Avoid pioarduino esptool postinstall breakage on older Homebrew PlatformIO cores
  platformio/tool-esptoolpy@~1.40501.0
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
  https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
  https://github.com/lvgl/lvgl.git#v8.4.0
  miq19/eModbus@^1.7.4

[common]
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -I src
  -I src/ui
  -I src/telemetry

[rgb_lcd]
build_flags =
  -DLV_COLOR_16_SWAP=0

[env:BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_5_B]
board = BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_5_B
build_flags =
  ${common.build_flags}
  ${rgb_lcd.build_flags}
  -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
  -DBOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_5_B

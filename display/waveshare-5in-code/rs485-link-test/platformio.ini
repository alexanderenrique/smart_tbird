; Raw RS-485 link test (no Modbus).
; Matches Waveshare 02_RS485_Test: 115200 8N1 on the display's onboard RS-485.
; https://docs.waveshare.com/ESP32-S3-Touch-LCD-5/Development-Environment-Setup-Arduino

[platformio]
default_envs = waveshare-master
boards_dir = ../boards

[env]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
  platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
  platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
  platformio/tool-esptoolpy@~1.40501.0
monitor_speed = 115200
upload_speed = 921600

; Waveshare ESP32-S3-Touch-LCD-5B — transmits a simple RS-485 blast every second.
[env:waveshare-master]
board = BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_5_B
build_src_filter = +<master.cpp> -<slave.cpp>

; Dummy ESP32 + MAX485 — receive-only listener (DE+RE held low).
[env:esp32dev-slave]
board = esp32dev
build_src_filter = +<slave.cpp> -<master.cpp>

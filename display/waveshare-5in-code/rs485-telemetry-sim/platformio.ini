; Dummy ESP32 Modbus RTU slave that slowly sweeps Thunderbird telemetry values.
; Flash to a second ESP32 with a MAX485/SP3485 transceiver for RS-485 bring-up.
; Uses the same pioarduino platform as the Waveshare display project for toolchain consistency.

[env]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
  platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
  platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
  platformio/tool-esptoolpy@~1.40501.0
monitor_speed = 115200
lib_deps =
  miq19/eModbus@^1.7.4
build_flags =
  -I include

[env:esp32dev]
board = esp32dev

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1

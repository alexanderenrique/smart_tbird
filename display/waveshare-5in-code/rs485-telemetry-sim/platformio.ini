; ATtiny3226 Modbus RTU slave: temps @ 1 Hz, RPM full sweep @ 1 s / 10 Hz.
; Flash via UPDI. Output: .pio/build/attiny3226/firmware.hex (also copied to firmware.hex).

[env:attiny3226]
platform = atmelmegaavr
board = ATtiny3226
framework = arduino
monitor_speed = 115200

; 20 MHz internal oscillator (megaTinyCore); fractional baud is fine at 115200.
board_build.f_cpu = 20000000L
board_hardware.oscillator = internal

build_flags =
  -I include

; Copy Intel HEX to project root for UPDI flashing tools.
extra_scripts =
  post:extra_scripts/copy_hex.py

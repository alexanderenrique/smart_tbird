; ATtiny3216 engine monitor — 5V / 20 MHz internal clock
; Adafruit UPDI Friend: SerialUPDI SLOW (57600 baud) via megaTinyCore prog.py
; (Same programmer as Arduino IDE "SerialUPDI - SLOW"; more reliable than pyupdi.)
;
; Debug:
;   pio run -t updi-probe              # verbose link test (no flash)
;   pio run -t updi-try-alternatives   # prog.py + pymcuprog + avrdude (interactive)
;   pio run -t updi-erase-locked       # unlock chip if previously locked
;   pio run -t updi-upload-verbose     # flash with -v -v logging
;   pio run -e attiny3216_serialupdi -t upload   # avrdude serialupdi path
;   ./scripts/updi_probe.sh

[env:attiny3216]
platform = atmelmegaavr
board = ATtiny3216
framework = arduino
extra_scripts = pre:extra_scripts/updi_targets.py

; 20 MHz internal oscillator (valid at 5V per megaTinyCore / Adafruit UPDI docs)
board_build.f_cpu = 20000000L
board_hardware.oscillator = internal

; Adafruit UPDI Friend (CH340 USB-serial at /dev/cu.usbserial-110)
; Wiring: Friend PWR→VCC, GND→GND, UPDI→PA0 (physical pin 16, NOT pin 18/PA2).
; After a failed upload, power-cycle the ATtiny before retrying.
; Custom upload does not auto-detect the port — update upload_port if yours differs.
upload_protocol = custom
upload_port = /dev/cu.usbserial-110
upload_speed = 57600

upload_flags =
  -t
  uart
  -u
  $UPLOAD_PORT
  -b
  $UPLOAD_SPEED
  -d
  $BOARD_MCU
  --fuses
  2:0x02

upload_command = ~/.platformio/penv/bin/python ~/.platformio/packages/framework-arduino-megaavr-megatinycore/tools/prog.py $UPLOAD_FLAGS -f $SOURCE -a write

; Adafruit default baud is 230400; SLOW is 57600. Try serialupdi env if prog.py fails:
[env:attiny3216_serialupdi]
extends = env:attiny3216
upload_protocol = serialupdi
upload_speed = 115200
upload_flags =

; Fast prog.py (Adafruit docs use 230400 at 5V); Mac CH340 may need -wd 1:
[env:attiny3216_fast]
extends = env:attiny3216
upload_speed = 230400
upload_flags =
  -t
  uart
  -u
  $UPLOAD_PORT
  -b
  $UPLOAD_SPEED
  -wd
  1
  -d
  $BOARD_MCU
  --fuses
  2:0x02

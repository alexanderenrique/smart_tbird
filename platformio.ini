; PlatformIO Project Configuration File for Smart Thunderbird CAN Network
; =====================================================================
; 
; This configuration supports multiple CAN nodes with different hardware:
; - Display Node: ESP32 with TFT display, LVGL, and LDR auto-dimming
; - SHT31 Node: ESP32-C3 with SHT31 temperature/humidity sensor
; - TMP36 Node: ESP32 with TMP36 temperature sensor
; - Central Node: ESP32 with SHT31 + MPU6050 IMU sensors
;
; Build commands:
;   pio run -e display_node    # Main display unit with LDR
;   pio run -e central_node    # Central node with SHT31 + MPU6050

[env]
; Global build flags for all environments
build_flags = 
    -Iinclude
    -Inodes/shared/can_lib
    -Inodes/shared/sensor_lib
    -Inodes/shared/utils

; ============================================================================
; DISPLAY NODE - Main unit with TFT display and LVGL
; ============================================================================
[env:display_node]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
    lvgl@^8.3.0
    TFT_eSPI
    adafruit/Adafruit MCP2515@^0.2.1
    adafruit/Adafruit BusIO@^1.17.2
build_flags = 
    -Iinclude
    -Inodes/shared/can_lib
    -Inodes/shared/sensor_lib
    -Inodes/shared/utils
    -Inodes/display_node
    -Ilib/lv_demos
    -Ilib/lv_demos/widgets
    -DLV_CONF_INCLUDE_SIMPLE
    -DNODE_TYPE=DISPLAY_NODE
    -DNODE_ID=1
monitor_speed = 9600
upload_speed = 921600
build_src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/>

; ============================================================================
; CENTRAL NODE - SHT31 + MPU6050 sensors
; ============================================================================
[env:central_node]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
    adafruit/Adafruit SHT31 Library@^2.2.0
    adafruit/Adafruit MCP2515@^0.2.1
    adafruit/Adafruit BusIO@^1.17.2
build_flags = 
    -Iinclude
    -Inodes/shared/can_lib
    -Inodes/shared/sensor_lib
    -Inodes/shared/utils
    -Inodes/central_node
    -DNODE_TYPE=CENTRAL_NODE
    -DNODE_ID=5
    -DSHT31_SENSOR_ID=1
    -DMPU6050_SENSOR_ID=2
monitor_speed = 9600
upload_speed = 921600
build_src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/>
